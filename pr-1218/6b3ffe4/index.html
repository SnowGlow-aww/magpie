<main><h1>#1218 界面预览</h1><p class="m">commit 6b3ffe4 · <a href="https://github.com/yetone/magpie/pull/1218">回到 PR</a> · Agent 页里 Claude Code 的详情新增了「sign-in」字段：可选 magpie 的密钥（默认）或 claude.ai，选 claude.ai 时把 ANTHROPIC_AUTH_TOKEN 写空以保留 claude.ai 登录；该字段只在网关接收任意密钥（回环、镜像的 WSL）时提供，未经 magpie 跑起来的 Claude Code 不画这个方块。界面文案同时补上了这两个选项的中/英/日/德等翻译。</p>
